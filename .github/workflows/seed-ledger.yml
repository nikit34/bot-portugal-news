name: Seed Dedup Ledger

concurrency:
  group: bot-schedule
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Config name (football / food_br)'
        required: false
        default: 'football'
      limit:
        description: 'Posts to read per platform'
        required: false
        default: '1000'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Seed the ledger
        run: python tools/seed_dedup_ledger.py --config ${{ inputs.config || 'football' }} --limit ${{ inputs.limit || '1000' }}
        timeout-minutes: 15
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          FACEBOOK_ACCESS_TOKEN: ${{ inputs.config == 'food_br' && secrets.FACEBOOK_ACCESS_TOKEN_FOOD || secrets.FACEBOOK_ACCESS_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          LOG_LEVEL: INFO
